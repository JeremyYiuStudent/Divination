<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Divination</title>
  <meta name="description" content="A collection of traditional divination methods — I Ching, Tarot, Runes, Ogham, Geomancy and Kau Cim — cast with true randomness.">
  <meta name="theme-color" content="#06050d">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230d0a1f' stroke='%23d9b56c'/%3E%3Cpath d='M16 5l2.6 8.4L27 16l-8.4 2.6L16 27l-2.6-8.4L5 16l8.4-2.6z' fill='%23d9b56c'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Noto+Sans+Mongolian&family=Noto+Sans+Ogham&family=Noto+Sans+Runic&family=Noto+Sans+Symbols&family=Noto+Sans+Symbols+2&family=Noto+Serif+SC:wght@400;600;700&family=Noto+Serif+TC:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/main.css?v=2">
  <link rel="stylesheet" href="css/iching.css?v=2">
  <link rel="stylesheet" href="css/tarot.css?v=2">
  <link rel="stylesheet" href="css/runes.css?v=2">
  <link rel="stylesheet" href="css/ogham.css?v=2">
  <link rel="stylesheet" href="css/geomancy.css?v=2">
  <link rel="stylesheet" href="css/kaucim.css?v=2">
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="nebula" aria-hidden="true"></div>
  <div id="glow" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="#/"><span class="brand-star">✦</span><span data-en="Divination" data-zh="占卜">Divination</span></a>
    <a class="crumb" href="#/" aria-label="All oracles" data-en-label="All oracles" data-zh-label="全部占卜"><span class="crumb-arrow" aria-hidden="true">←</span><span class="crumb-name"></span></a>
    <nav class="top-actions">
      <button id="lang-btn" class="icon-btn lang-btn" type="button">中文</button>
      <button id="journal-btn" class="icon-btn" type="button" aria-controls="journal">☾ <span data-en="Journal" data-zh="记录">Journal</span></button>
      <button id="sound-btn" class="icon-btn" type="button" aria-pressed="true">♪ <span data-en="Sound" data-zh="声音">Sound</span></button>
    </nav>
  </header>

  <main id="stage"></main>

  <div id="scrim" aria-hidden="true"></div>
  <aside id="journal" class="drawer" aria-hidden="true" aria-label="Journal">
    <div class="drawer-head">
      <h2 data-en="Journal" data-zh="记录">Journal</h2>
      <button class="icon-btn" id="journal-close" type="button" aria-label="Close journal" data-en-label="Close journal" data-zh-label="关闭记录">✕</button>
    </div>
    <p class="drawer-note" data-en="Every casting is kept here, in this browser only." data-zh="每次占卜都保存在这里，仅存于本浏览器。">Every casting is kept here, in this browser only.</p>
    <ol id="journal-list"></ol>
    <button class="linkbtn" id="journal-clear" type="button" data-en="Clear journal" data-zh="清空记录">Clear journal</button>
  </aside>

  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <button class="icon-btn modal-close" type="button" aria-label="Close" data-en-label="Close" data-zh-label="关闭">✕</button>
      <div class="modal-body"></div>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/core.js?v=2"></script>
  <script src="js/data.js?v=2"></script>
  <script src="js/meanings.js?v=2"></script>
  <script src="js/oracles/iching.js?v=2"></script>
  <script src="js/oracles/tarot.js?v=2"></script>
  <script src="js/oracles/runes.js?v=2"></script>
  <script src="js/oracles/ogham.js?v=2"></script>
  <script src="js/oracles/geomancy.js?v=2"></script>
  <script src="js/oracles/kaucim.js?v=2"></script>
  <script src="js/main.js?v=2"></script>
</body>
</html>
